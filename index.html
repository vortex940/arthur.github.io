<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflection Log</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header class="hero">
      <p class="eyebrow">Weekly Reflection</p>
      <h1>Progress &amp; Reflection Log</h1>
      <p class="subtitle">
        Track your weekly progress and capture your thoughts.<br />
        <span class="highlight">Take a moment to pause and reflect — especially on Tuesdays.</span>
      </p>
      <div class="stats">
        <div class="stat">
          <span id="stat-count" class="stat-num">0</span>
          <span class="stat-label">Entries</span>
        </div>
        <div class="stat">
          <span id="stat-latest" class="stat-num">—</span>
          <span class="stat-label">Latest</span>
        </div>
      </div>
    </header>

    <main>
      <section class="composer card">
        <h2>New Reflection</h2>
        <form id="reflection-form">
          <div class="grid">
            <div class="field">
              <label for="title">Title</label>
              <input
                id="title"
                type="text"
                placeholder="e.g. Week 7 · Pre-midterm review"
                required
              />
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input id="date" type="date" required />
            </div>
          </div>

          <div class="grid">
            <div class="field">
              <label for="progress">This Week's Progress 💪</label>
              <textarea
                id="progress"
                rows="3"
                placeholder="What did you accomplish this week? What did you learn?"
              ></textarea>
            </div>
            <div class="field">
              <label for="reflect">Reflection 🧠</label>
              <textarea
                id="reflect"
                rows="3"
                placeholder="Any challenges? How do you want to adjust next week?"
              ></textarea>
            </div>
          </div>

          <div class="form-footer">
            <div class="tag-box">
              <label class="tag-label">Tag</label>
              <select id="tag">
                <option value="progress">Progress</option>
                <option value="reflection" selected>Reflection</option>
                <option value="milestone">Milestone</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">Save Entry ✦</button>
          </div>
        </form>
      </section>

      <section class="entries">
        <div class="entries-head">
          <h2>Reflection Wall</h2>
          <div class="toolbar">
            <input
              id="search"
              type="search"
              placeholder="Search title or content…"
            />
            <select id="filter">
              <option value="all">All tags</option>
              <option value="progress">Progress</option>
              <option value="reflection">Reflection</option>
              <option value="milestone">Milestone</option>
            </select>
          </div>
        </div>
        <div id="entry-list" class="entry-list"></div>
        <p id="empty-state" class="empty-state">
          No reflections yet. Write your first one ✏️
        </p>
      </section>
    </main>

    <footer>
      <p>Made for me · Reflected every Tuesday 🌱</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
